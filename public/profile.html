<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - LANStream Pro</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
                        <path d="M12 5.5v14l-5-5 5-5z"/>
                    </svg>
                    <span class="logo-text">LANStream Pro</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="/">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                            <span>仪表盘</span>
                        </a>
                    </li>
                    <li>
                        <a href="/video.html">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
                            <span>视频播放</span>
                        </a>
                    </li>
                    <li>
                        <a href="/file-manager.html">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                            <span>文件管理</span>
                        </a>
                    </li>
                    <li class="admin-only" style="display: none;">
                        <a href="/admin.html">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                            <span>服务器管理</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="/profile.html">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <span>个人资料</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    <span>退出登录</span>
                </button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="header-title">
                    <h1>个人资料</h1>
                </div>
                <div class="header-user">
                    <div class="user-avatar" id="headerAvatar"></div>
                    <span class="user-name" id="headerUsername">加载中...</span>
                </div>
            </header>

            <!-- 资料内容 -->
            <div class="profile-content">
                <!-- 头像卡片 -->
                <div class="profile-card avatar-card">
                    <div class="card-header">
                        <h2>头像</h2>
                    </div>
                    <div class="card-body">
                        <div class="avatar-section">
                            <div class="avatar-wrapper" id="avatarWrapper">
                                <img src="" alt="用户头像" class="avatar-image" id="avatarImage">
                                <div class="avatar-overlay">
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                                    </svg>
                                    <span>更换头像</span>
                                </div>
                            </div>
                            <input type="file" id="avatarInput" accept="image/*" hidden>
                            <p class="avatar-hint">支持 JPG、PNG 格式，最大 2MB</p>
                        </div>
                    </div>
                </div>

                <!-- 基本信息卡片 -->
                <div class="profile-card info-card">
                    <div class="card-header">
                        <h2>基本信息</h2>
                        <button class="edit-btn" id="editInfoBtn">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            编辑
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="info-group">
                            <label>用户名</label>
                            <div class="info-value" id="usernameValue">加载中...</div>
                        </div>
                        <div class="info-group">
                            <label>显示名称</label>
                            <div class="info-value" id="displayNameValue">加载中...</div>
                        </div>
                        <div class="info-group">
                            <label>邮箱</label>
                            <div class="info-value" id="emailValue">加载中...</div>
                        </div>
                        <div class="info-group">
                            <label>角色</label>
                            <div class="info-value" id="roleValue">加载中...</div>
                        </div>
                        <div class="info-group">
                            <label>注册时间</label>
                            <div class="info-value" id="createdAtValue">加载中...</div>
                        </div>
                        <div class="info-group">
                            <label>最后登录</label>
                            <div class="info-value" id="lastLoginValue">加载中...</div>
                        </div>
                    </div>
                </div>

                <!-- 修改密码卡片 -->
                <div class="profile-card password-card">
                    <div class="card-header">
                        <h2>修改密码</h2>
                    </div>
                    <div class="card-body">
                        <form id="passwordForm" class="profile-form">
                            <div class="form-group">
                                <label for="currentPassword">当前密码</label>
                                <input type="password" id="currentPassword" placeholder="请输入当前密码" required>
                            </div>
                            <div class="form-group">
                                <label for="newPassword">新密码</label>
                                <input type="password" id="newPassword" placeholder="请输入新密码（至少8位）" required minlength="8">
                                <div class="password-strength" id="passwordStrength"></div>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">确认新密码</label>
                                <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn-primary">确认修改</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 编辑信息模态框 -->
                <div class="modal" id="editInfoModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>编辑个人信息</h3>
                            <button class="modal-close" id="closeModalBtn">&times;</button>
                        </div>
                        <div class="modal-body">
                            <form id="editInfoForm">
                                <div class="form-group">
                                    <label for="editDisplayName">显示名称</label>
                                    <input type="text" id="editDisplayName" placeholder="请输入显示名称" maxlength="30">
                                </div>
                                <div class="form-group">
                                    <label for="editEmail">邮箱</label>
                                    <input type="email" id="editEmail" placeholder="请输入邮箱">
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-secondary" id="cancelEditBtn">取消</button>
                            <button class="btn-primary" id="saveInfoBtn">保存</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
